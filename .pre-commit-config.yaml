
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: gitleaks
        name: Gitleaks secret detection
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false
