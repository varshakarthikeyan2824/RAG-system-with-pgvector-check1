# Whole stack: app + LangGraph agent + PostgreSQL (pgvector) + Caddy (HTTPS).
#
#   1. cp app.env.example app.env; cp postgres.env.example postgres.env; cp langgraph.env.example langgraph.env
#      Fill them in (never commit them). The database password must be the same in app.env and postgres.env.
#   2. UV_TAG=<release> ./scripts/pin_digests.sh      (fills the image digests, once)
#   3. docker compose config --quiet                  (valid? NOTE: without --quiet it prints your secrets)
#   4. docker compose up -d --build ; docker compose ps
#   5. open https://localhost/health  (Caddy's own certificate: your browser will warn, accept it for the lab)
#
# Update:   build the next tag (e.g. release-b), change the two `image:` tags, `docker compose up -d`
# Roll back: set the tags back to release-a, `docker compose up -d`
#
# Ollama runs on the HOST. It must listen on an address the containers can reach
# (OLLAMA_HOST=0.0.0.0:11434) and port 11434 must be firewalled from the outside.
name: water-rag

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardening
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    env_file: postgres.env
    # The official image starts as root, fixes file ownership, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Run in file-name order, only on the first start (empty volume).
      - ./db/00_extension.sql:/docker-entrypoint-initdb.d/00_extension.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
      - ./documents.sql:/docker-entrypoint-initdb.d/20_documents.sql:ro
      - ./migrations/001_authentication.sql:/docker-entrypoint-initdb.d/30_authentication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    # No `ports:` on purpose: only containers on this Compose network can reach the database.

  app:
    <<: *hardening
    build: .
    image: water-rag:release-b
    env_file: app.env
    extra_hosts:
      - "host.docker.internal:host-gateway"     # reach Ollama on the host
    # Trust Caddy's X-Forwarded-* headers: safe because no port of this service is published.
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--timeout-graceful-shutdown", "15"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 20s
    mem_limit: 512m

  langgraph:
    <<: *hardening
    build: ./langgraph_lab
    image: langgraph-agent:release-a
    env_file: langgraph.env
    ports:
      - "127.0.0.1:8100:8000"      # this computer only. The agent has NO login: never publish it or route it through Caddy.
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 20s
    mem_limit: 256m

  proxy:
    <<: *hardening
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

volumes:
  pg_data:
  caddy_data:
  caddy_config:
