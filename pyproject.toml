[project]
name = "water-utility-rag"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.4",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
