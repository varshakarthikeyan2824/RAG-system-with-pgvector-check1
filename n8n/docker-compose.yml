name: n8n-lab
# n8n with its own PostgreSQL database (day 13). Based on the official Docker pages:
#   https://docs.n8n.io/hosting/installation/docker/
#   https://docs.n8n.io/hosting/installation/server-setups/docker-compose/
#
# Placeholders filled on 17 Nov 2026:
#   n8n image        2.47.7 (current stable on the n8n release notes; 2.48.x is beta)
#   Postgres image   17, pinned by digest. the digest is filled in below.
#                    Get it with:
#                      docker pull postgres:17
#                      docker inspect --format='{{index .RepoDigests 0}}' postgres:17
#                    Paste only the hex after "sha256:" below.
#   Data path        /var/lib/postgresql/data (correct for Postgres 17 and earlier; if you
#                    move to Postgres 18 or later the path and volume layout change)
#
# LICENCE REMINDER: n8n uses the Sustainable Use License: internal business, non-commercial or
# personal use. Before you deploy it at a customer, confirm the position with n8n
# (license@n8n.io) or your legal team and write it in the docs (Playbook N8N-14, ORCH-02).
#
# Commands you will use:
#   docker compose config --quiet   check the file and .env are valid (prints nothing if OK)
#   docker compose up -d            start in the background
#   docker compose ps               see what runs
#   docker compose logs -f n8n      follow the log
#   docker compose pull && docker compose down && docker compose up -d     update
#
# WARNING: "docker compose config" without --quiet prints your .env values, secrets included.
# Do not paste its output into chats, tickets or Git.
services:
  n8n:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"          # this computer only; a proxy gives HTTPS later (N8N-11)
    # Lets the container reach FastAPI running on the WSL host as http://host.docker.internal:8000
    # (needed with Docker Engine on Linux/WSL; Docker Desktop adds this name by itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE}     # used by schedule nodes
      TZ: ${TIMEZONE}                   # the container clock
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Store workflow data in PostgreSQL instead of the default SQLite file.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Encrypts the credentials n8n stores. BACK IT UP: if you lose it, saved credentials are unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"          # hours: keep 7 days
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      EXECUTIONS_TIMEOUT: "60"        # seconds: stop any run that takes longer
      EXECUTIONS_TIMEOUT_MAX: "120"   # the most a workflow may ask for
    volumes:
      # The official page keeps the .n8n folder even with PostgreSQL: it holds keys and other data.
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports: only n8n (on the same Compose network) may reach the database (DB-12).

volumes:
  n8n_data:
  n8n_db:
